<footer class="site-footer">
  <div class="container">
    <div class="footer-top">
      <div class="footer-brand">
        <a class="brand footer-brand-link" href="index.html" aria-label="{{BRAND_NAME}} — home">
          <span class="brand-logo">{{BRAND_LOGO}}<span class="brand-dot">{{BRAND_SUFFIX}}</span></span>
        </a>
        <p class="footer-blurb">{{FOOTER_BLURB}}</p>
        <ul class="social-list footer-social" aria-label="Social profiles">
          {{SOCIAL_LINKS}}
        </ul>
      </div>

      {{FOOTER_GROUPS}}

      <div class="footer-contact">
        <p class="footer-eyebrow">Have a project in mind?</p>
        <a class="footer-email" href="mailto:{{OWNER_EMAIL}}">{{OWNER_EMAIL}}</a>
        <p class="footer-response">{{RESPONSE_TIME}}</p>
        <a class="btn btn-outline-light btn-sm" href="contact.html">
          Start a conversation
          <svg class="icon" aria-hidden="true"><use href="#icon-arrow-up-right"></use></svg>
        </a>
      </div>
    </div>

    <div class="footer-bottom">
      <p class="footer-copy">&copy; <span data-current-year>{{YEAR}}</span> {{BRAND_NAME}}. {{FOOTER_CREDIT}}</p>
      <ul class="footer-legal" aria-label="Site information">
        {{LEGAL_LINKS}}
      </ul>
    </div>
    <p class="footer-demo">{{DEMO_NOTE}}</p>
  </div>
</footer>
