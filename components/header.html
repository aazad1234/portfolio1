<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header" data-site-header>
  <div class="scroll-progress" data-scroll-progress aria-hidden="true"><span></span></div>
  <div class="container header-inner">
    <a class="brand" href="index.html" aria-label="{{BRAND_NAME}} — home">
      <span class="brand-logo">{{BRAND_LOGO}}<span class="brand-dot">{{BRAND_SUFFIX}}</span></span>
    </a>

    <div class="header-nav" id="primary-navigation" data-nav-panel>
      <!-- @navigation -->
    </div>

    <div class="header-actions">
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark theme">
        <span class="theme-toggle-icon theme-toggle-light" aria-hidden="true"><svg class="icon"><use href="#icon-sun"></use></svg></span>
        <span class="theme-toggle-icon theme-toggle-dark" aria-hidden="true"><svg class="icon"><use href="#icon-moon"></use></svg></span>
      </button>
      <a class="btn btn-primary btn-sm header-cta" href="{{CTA_HREF}}">
        {{CTA_LABEL}}
        <svg class="icon" aria-hidden="true"><use href="#icon-arrow-up-right"></use></svg>
      </a>
      <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="primary-navigation">
        <span class="sr-only" data-nav-toggle-label>Open navigation</span>
        <svg class="icon nav-toggle-open" aria-hidden="true"><use href="#icon-menu"></use></svg>
        <svg class="icon nav-toggle-close" aria-hidden="true"><use href="#icon-close"></use></svg>
      </button>
    </div>
  </div>
</header>
<div class="nav-backdrop" data-nav-backdrop aria-hidden="true"></div>
