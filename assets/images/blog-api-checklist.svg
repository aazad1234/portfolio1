<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">An API design checklist</title>
  <desc id="desc">A dark editorial cover showing an API request, response and a checklist of engineering decisions.</desc>
  <defs>
    <linearGradient id="bg" x1="40" y1="0" x2="1160" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0C1020"/>
      <stop offset=".54" stop-color="#151A35"/>
      <stop offset="1" stop-color="#101D26"/>
    </linearGradient>
    <linearGradient id="accent" x1="680" y1="90" x2="1080" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset=".52" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000000" flood-opacity=".48"/>
    </filter>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#FFFFFF" stroke-opacity=".04"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1050" cy="80" r="240" fill="#818CF8" opacity=".11"/>
  <circle cx="120" cy="590" r="260" fill="#34D399" opacity=".07"/>
  <path d="M0 570c260-100 480-70 690 4 170 60 350 52 510-22v78H0z" fill="#FFFFFF" opacity=".025"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="72" y="62" width="150" height="32" rx="16" fill="#818CF8" opacity=".12"/>
    <circle cx="90" cy="78" r="3.5" fill="#A5B4FC"/>
    <text x="102" y="82" fill="#C7D2FE" font-size="10" font-weight="700" letter-spacing="1.5">ENGINEERING</text>

    <text x="72" y="202" fill="#FFFFFF" font-family="Segoe UI Variable Display, Segoe UI, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-3">An API people</text>
    <text x="72" y="271" fill="#A5B4FC" font-family="Segoe UI Variable Display, Segoe UI, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-3">can trust.</text>

    <text x="74" y="325" fill="#A9B0C4" font-size="14">A practical checklist for clear contracts, useful errors</text>
    <text x="74" y="348" fill="#A9B0C4" font-size="14">and responses a frontend can actually depend on.</text>

    <text x="72" y="550" fill="#737D94" font-size="10" font-weight="700" letter-spacing="2">JOHN ANDERSON / NOTES</text>
    <text x="1128" y="550" fill="#737D94" font-size="10" font-weight="700" letter-spacing="2" text-anchor="end">03 / 03</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="650" y="74" width="480" height="464" rx="28" fill="#080C17" stroke="#FFFFFF" stroke-opacity=".1"/>
    <rect x="650" y="74" width="480" height="56" rx="28" fill="#10182A"/>
    <rect x="650" y="102" width="480" height="28" fill="#10182A"/>
    <circle cx="678" cy="102" r="6" fill="#F87171" opacity=".9"/>
    <circle cx="698" cy="102" r="6" fill="#FBBF24" opacity=".9"/>
    <circle cx="718" cy="102" r="6" fill="#34D399" opacity=".9"/>
    <text x="1098" y="106" fill="#6E7A8E" font-family="Consolas, monospace" font-size="9" text-anchor="end">api.http</text>

    <g font-family="Consolas, monospace" font-size="11">
      <rect x="678" y="156" width="50" height="24" rx="5" fill="#34D399" opacity=".13"/>
      <text x="690" y="172" fill="#6EE7B7" font-size="9" font-weight="700">GET</text>
      <text x="740" y="172" fill="#D9DFEC">/v1/projects?limit=20</text>
      <text x="1068" y="172" fill="#5D6A7F" text-anchor="end">200</text>

      <rect x="678" y="199" width="50" height="24" rx="5" fill="#818CF8" opacity=".13"/>
      <text x="688" y="215" fill="#A5B4FC" font-size="9" font-weight="700">POST</text>
      <text x="740" y="215" fill="#D9DFEC">/v1/projects</text>

      <rect x="678" y="231" width="50" height="24" rx="5" fill="#FBBF24" opacity=".1"/>
      <text x="688" y="247" fill="#FCD34D" font-size="9" font-weight="700">PATCH</text>
      <text x="740" y="247" fill="#D9DFEC">/v1/projects/:id</text>
      <text x="1068" y="247" fill="#5D6A7F" text-anchor="end">204</text>

      <rect x="678" y="279" width="424" height="1" fill="#FFFFFF" opacity=".08"/>

      <text x="678" y="309" fill="#7E8BA1">// response.json</text>
      <text x="678" y="333" fill="#E8EDF7">{</text>
      <text x="698" y="355" fill="#A5B4FC">"data"</text>
      <text x="744" y="355" fill="#E8EDF7">: [</text>
      <text x="718" y="377" fill="#E8EDF7">{</text>
      <text x="738" y="399" fill="#6EE7B7">"id"</text>
      <text x="772" y="399" fill="#E8EDF7">: </text>
      <text x="790" y="399" fill="#FCD34D">"prj_01"</text>
      <text x="856" y="399" fill="#E8EDF7">,</text>
      <text x="738" y="421" fill="#6EE7B7">"status"</text>
      <text x="800" y="421" fill="#E8EDF7">: </text>
      <text x="818" y="421" fill="#FCD34D">"active"</text>
      <text x="738" y="443" fill="#6EE7B7">"updatedAt"</text>
      <text x="854" y="443" fill="#E8EDF7">: </text>
      <text x="872" y="443" fill="#FCD34D">"2026-01-27"</text>
      <text x="718" y="465" fill="#E8EDF7">}</text>
      <text x="698" y="487" fill="#E8EDF7">],</text>
      <text x="698" y="509" fill="#A5B4FC">"meta"</text>
      <text x="744" y="509" fill="#E8EDF7">: { "next": null }</text>
      <text x="678" y="531" fill="#E8EDF7">}</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="1048" y="54" width="88" height="88" rx="22" fill="#0A0F1B" stroke="#34D399" stroke-opacity=".28"/>
    <path d="M1070 98l10 10 24-27" fill="none" stroke="#34D399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="none" stroke="url(#accent)" opacity=".45">
    <circle cx="1090" cy="540" r="46" stroke-dasharray="5 8"/>
    <circle cx="1090" cy="540" r="62" stroke-opacity=".4"/>
  </g>
</svg>
