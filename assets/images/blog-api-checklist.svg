<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">An API design checklist</title>
  <desc id="desc">A dark editorial cover showing an API request, response and a checklist of engineering decisions.</desc>
  <defs>
    <linearGradient id="bg" x1="40" y1="0" x2="1160" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1A0F09"/>
      <stop offset=".54" stop-color="#2E1D13"/>
      <stop offset="1" stop-color="#140A04"/>
    </linearGradient>
    <linearGradient id="accent" x1="680" y1="90" x2="1080" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C9954C"/>
      <stop offset=".52" stop-color="#E8C27A"/>
      <stop offset="1" stop-color="#8C6E5A"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity=".6"/>
    </filter>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#C9954C" stroke-opacity=".04"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1050" cy="80" r="240" fill="#C9954C" opacity=".08"/>
  <circle cx="120" cy="590" r="260" fill="#8C6E5A" opacity=".08"/>
  <path d="M0 570c260-100 480-70 690 4 170 60 350 52 510-22v78H0z" fill="#FAF8F5" opacity=".015"/>

  <g font-family="Bricolage Grotesque, Segoe UI, Arial, sans-serif">
    <rect x="72" y="62" width="150" height="32" rx="16" fill="#C9954C" opacity=".14"/>
    <circle cx="90" cy="78" r="3.5" fill="#E8C27A"/>
    <text x="102" y="82" fill="#E8C27A" font-size="10" font-weight="700" letter-spacing="1.5">ENGINEERING</text>

    <text x="72" y="202" fill="#FAF8F5" font-family="Bricolage Grotesque, Georgia, serif" font-size="64" font-weight="700" letter-spacing="-1.5">An API people</text>
    <text x="72" y="271" fill="#E8C27A" font-family="Bricolage Grotesque, Georgia, serif" font-style="italic" font-size="64" font-weight="700" letter-spacing="-1.5">can trust.</text>

    <text x="74" y="325" fill="#D9CFC2" font-size="14">A practical checklist for clear contracts, useful errors</text>
    <text x="74" y="348" fill="#D9CFC2" font-size="14">and responses a frontend can actually depend on.</text>

    <text x="72" y="550" fill="#A89484" font-size="10" font-weight="700" letter-spacing="2">JOHN ANDERSON / NOTES</text>
    <text x="1128" y="550" fill="#A89484" font-size="10" font-weight="700" letter-spacing="2" text-anchor="end">03 / 03</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="650" y="74" width="480" height="464" rx="28" fill="#23140D" stroke="#C9954C" stroke-opacity=".18"/>
    <rect x="650" y="74" width="480" height="56" rx="28" fill="#2E1D13"/>
    <rect x="650" y="102" width="480" height="28" fill="#2E1D13"/>
    <circle cx="678" cy="102" r="6" fill="#D9A87C" opacity=".9"/>
    <circle cx="698" cy="102" r="6" fill="#C9954C" opacity=".9"/>
    <circle cx="718" cy="102" r="6" fill="#8C6E5A" opacity=".9"/>
    <text x="1098" y="106" fill="#A89484" font-family="Consolas, monospace" font-size="9" text-anchor="end">api.http</text>

    <g font-family="Consolas, monospace" font-size="11">
      <rect x="678" y="156" width="50" height="24" rx="5" fill="#C9954C" opacity=".18"/>
      <text x="690" y="172" fill="#E8C27A" font-size="9" font-weight="700">GET</text>
      <text x="740" y="172" fill="#EDE8DF">/v1/projects?limit=20</text>
      <text x="1068" y="172" fill="#8C6E5A" text-anchor="end">200</text>

      <rect x="678" y="199" width="50" height="24" rx="5" fill="#8C6E5A" opacity=".25"/>
      <text x="688" y="215" fill="#D9CFC2" font-size="9" font-weight="700">POST</text>
      <text x="740" y="215" fill="#EDE8DF">/v1/projects</text>

      <rect x="678" y="231" width="50" height="24" rx="5" fill="#C9954C" opacity=".14"/>
      <text x="688" y="247" fill="#E8C27A" font-size="9" font-weight="700">PATCH</text>
      <text x="740" y="247" fill="#EDE8DF">/v1/projects/:id</text>
      <text x="1068" y="247" fill="#8C6E5A" text-anchor="end">204</text>

      <rect x="678" y="279" width="424" height="1" fill="#C9954C" opacity=".12"/>

      <text x="678" y="309" fill="#A89484">// response.json</text>
      <text x="678" y="333" fill="#FAF8F5">{</text>
      <text x="698" y="355" fill="#E8C27A">"data"</text>
      <text x="744" y="355" fill="#FAF8F5">: [</text>
      <text x="718" y="377" fill="#FAF8F5">{</text>
      <text x="738" y="399" fill="#D4A574">"id"</text>
      <text x="772" y="399" fill="#FAF8F5">: </text>
      <text x="790" y="399" fill="#E8C27A">"prj_01"</text>
      <text x="856" y="399" fill="#FAF8F5">,</text>
      <text x="738" y="421" fill="#D4A574">"status"</text>
      <text x="800" y="421" fill="#FAF8F5">: </text>
      <text x="818" y="421" fill="#E8C27A">"active"</text>
      <text x="738" y="443" fill="#D4A574">"updatedAt"</text>
      <text x="854" y="443" fill="#FAF8F5">: </text>
      <text x="872" y="443" fill="#E8C27A">"2026-01-27"</text>
      <text x="718" y="465" fill="#FAF8F5">}</text>
      <text x="698" y="487" fill="#FAF8F5">],</text>
      <text x="698" y="509" fill="#E8C27A">"meta"</text>
      <text x="744" y="509" fill="#FAF8F5">: { "next": null }</text>
      <text x="678" y="531" fill="#FAF8F5">}</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="1048" y="54" width="88" height="88" rx="22" fill="#2E1D13" stroke="#C9954C" stroke-opacity=".35"/>
    <path d="M1070 98l10 10 24-27" fill="none" stroke="#E8C27A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="none" stroke="url(#accent)" opacity=".45">
    <circle cx="1090" cy="540" r="46" stroke-dasharray="5 8"/>
    <circle cx="1090" cy="540" r="62" stroke-opacity=".4"/>
  </g>
</svg>
