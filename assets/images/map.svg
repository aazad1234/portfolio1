<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Abstract map of San Francisco</title>
  <desc id="desc">A stylised street map with blocks, a park, the waterfront and a location marker.</desc>
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="170" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8DFD3"/>
      <stop offset="1" stop-color="#DDCFBE"/>
    </linearGradient>
    <linearGradient id="pin" x1="410" y1="180" x2="470" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8C6E5A"/>
      <stop offset="1" stop-color="#4E3427"/>
    </linearGradient>
    <filter id="pinShadow" x="-60%" y="-40%" width="220%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#2E1D13" flood-opacity=".25"/>
    </filter>
    <pattern id="blocks" width="34" height="34" patternUnits="userSpaceOnUse">
      <rect width="26" height="26" rx="3" fill="#EDE7DD"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="#FAF7F2"/>
