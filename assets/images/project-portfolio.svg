          <circle cx="895" cy="226" r="98" fill="#C9954C" opacity=".18"/>
          <path d="M744 484c8-78 49-118 116-118s108 40 116 118h-232z" fill="#2E1D13"/>
          <path d="M806 353h92v58c0 32-20 54-46 54s-46-22-46-54v-58z" fill="#D9A87C"/>
          <ellipse cx="852" cy="306" rx="72" ry="84" fill="#E8C2A0"/>
          <path d="M779 303c-2-58 31-94 78-94 45 0 74 32 72 91-18-21-41-31-71-30-31 1-57 12-79 33z" fill="#3D2619"/>
          <path d="M781 292c-10 9-16 22-16 38 0 21 7 35 18 43l3-31-5-50z" fill="#3D2619"/>
          <path d="M922 292c10 9 16 22 16 38 0 21-7 35-18 43l-3-31 5-50z" fill="#3D2619"/>
          <circle cx="826" cy="316" r="4" fill="#1A0F09"/>
          <circle cx="878" cy="316" r="4" fill="#1A0F09"/>
          <path d="M846 352c4 3 9 3 13 0" fill="none" stroke="#8C5E45" stroke-width="3" stroke-linecap="round"/>
          <path d="M819 264c17-10 48-12 68-2" fill="none" stroke="#2E1D13" stroke-width="3" stroke-linecap="round" opacity=".55"/>
          <circle cx="852" cy="320" r="138" fill="#6B4C3B" opacity=".04"/>
        </g>
      </g>

      <g filter="url(#cardShadow)">
        <rect x="676" y="500" width="190" height="54" rx="12" fill="#FFFFFF" stroke="#E8DFD3"/>
        <rect x="690" y="513" width="26" height="26" rx="6" fill="#F5EFE6"/>
        <text x="703" y="530" fill="#6B4C3B" font-family="Bricolage Grotesque, Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">⌘</text>
        <text x="726" y="521" fill="#A89484" font-family="Bricolage Grotesque, Segoe UI, Arial, sans-serif" font-size="7">DAILY TOOLKIT</text>
        <text x="726" y="536" fill="#2E1D13" font-family="Bricolage Grotesque, Segoe UI, Arial, sans-serif" font-size="9" font-weight="600">React · Node · TypeScript</text>
      </g>

      <rect x="122" y="620" width="255" height="138" rx="15" fill="#FFFFFF" stroke="#EDE5D8"/>
      <rect x="140" y="638" width="133" height="9" rx="4.5" fill="#4E3427"/>
      <rect x="140" y="655" width="202" height="5" rx="2.5" fill="#E5DACD"/>
      <rect x="140" y="666" width="172" height="5" rx="2.5" fill="#E5DACD"/>
      <rect x="140" y="696" width="218" height="44" rx="8" fill="#FAF5ED"/>
      <path d="M158 723l19-14 16 9 25-19" fill="none" stroke="#8C6E5A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="218" cy="699" r="3" fill="#C9954C"/>

      <rect x="393" y="620" width="255" height="138" rx="15" fill="#FFFFFF" stroke="#EDE5D8"/>
      <rect x="411" y="638" width="111" height="9" rx="4.5" fill="#4E3427"/>
      <rect x="411" y="655" width="202" height="5" rx="2.5" fill="#E5DACD"/>
      <rect x="411" y="666" width="164" height="5" rx="2.5" fill="#E5DACD"/>
      <rect x="411" y="693" width="86" height="47" rx="8" fill="#F7F1E8"/>
      <rect x="505" y="693" width="62" height="20" rx="6" fill="#F2ECE0"/>
      <rect x="505" y="720" width="42" height="20" rx="6" fill="#EDE3D3"/>

      <rect x="664" y="620" width="255" height="138" rx="15" fill="#FFFFFF" stroke="#EDE5D8"/>
      <rect x="682" y="638" width="142" height="9" rx="4.5" fill="#4E3427"/>
      <rect x="682" y="655" width="193" height="5" rx="2.5" fill="#E5DACD"/>
      <rect x="682" y="666" width="154" height="5" rx="2.5" fill="#E5DACD"/>
      <circle cx="713" cy="715" r="21" fill="#C9954C" opacity=".14"/>
      <circle cx="713" cy="715" r="7" fill="#8C6E5A"/>
      <path d="M748 707h82M748 719h58M748 731h72" stroke="#E5DACD" stroke-width="5" stroke-linecap="round"/>

      <rect x="935" y="620" width="143" height="138" rx="15" fill="#1A0F09"/>
      <text x="954" y="651" fill="#E8C27A" font-family="Consolas, monospace" font-size="8">const</text>
      <text x="986" y="651" fill="#FAF8F5" font-family="Consolas, monospace" font-size="8">john = {</text>
      <text x="954" y="668" fill="#D4A574" font-family="Consolas, monospace" font-size="8">'product'</text>
      <text x="999" y="668" fill="#FAF8F5" font-family="Consolas, monospace" font-size="8">: true,</text>
      <text x="954" y="685" fill="#D4A574" font-family="Consolas, monospace" font-size="8">'calm'</text>
      <text x="989" y="685" fill="#FAF8F5" font-family="Consolas, monospace" font-size="8">: true,</text>
      <text x="954" y="702" fill="#D4A574" font-family="Consolas, monospace" font-size="8">'fast'</text>
      <text x="982" y="702" fill="#FAF8F5" font-family="Consolas, monospace" font-size="8">: true</text>
      <text x="954" y="719" fill="#FAF8F5" font-family="Consolas, monospace" font-size="8">};</text>
      <circle cx="1048" cy="646" r="4" fill="#C9954C"/>
    </g>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="910" y="60" width="188" height="58" rx="14" fill="#FFFFFF"/>
    <circle cx="936" cy="89" r="13" fill="#F4EFE6"/>
    <circle cx="936" cy="89" r="5" fill="#C9954C"/>
    <text x="958" y="85" fill="#A89484" font-family="Bricolage Grotesque, Segoe UI, Arial, sans-serif" font-size="7.5">BASED IN</text>
    <text x="958" y="99" fill="#2E1D13" font-family="Bricolage Grotesque, Segoe UI, Arial, sans-serif" font-size="10" font-weight="600">San Francisco, CA</text>
  </g>
