<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Portfolio website case study preview</title>
  <desc id="desc">A browser window showing a calm portfolio website with an editorial hero, portrait and project cards.</desc>
  <defs>
    <linearGradient id="page" x1="90" y1="40" x2="1110" y2="860" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".48" stop-color="#FDFBF9"/>
      <stop offset="1" stop-color="#F7F4F0"/>
    </linearGradient>
    <linearGradient id="accent" x1="710" y1="175" x2="1010" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6B4C3B"/>
      <stop offset=".56" stop-color="#8C6E5A"/>
      <stop offset="1" stop-color="#C9954C"/>
    </linearGradient>
    <linearGradient id="soft" x1="140" y1="180" x2="580" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".96"/>
      <stop offset="1" stop-color="#FAF8F5" stop-opacity=".85"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#2E1D13" flood-opacity=".16"/>
    </filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#2E1D13" flood-opacity=".09"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#6B4C3B" stroke-opacity=".05"/>
    </pattern>
    <clipPath id="browserClip">
      <rect x="82" y="92" width="1036" height="716" rx="26"/>
    </clipPath>
    <clipPath id="portraitClip">
      <circle cx="852" cy="340" r="138"/>
    </clipPath>
  </defs>

  <rect width="1200" height="900" fill="url(#page)"/>
  <circle cx="110" cy="120" r="260" fill="#C9954C" opacity=".06"/>
  <circle cx="1090" cy="770" r="280" fill="#6B4C3B" opacity=".06"/>
  <rect x="40" y="40" width="1120" height="820" rx="40" fill="url(#grid)"/>

  <g filter="url(#shadow)">
    <rect x="82" y="92" width="1036" height="716" rx="26" fill="#FFFFFF"/>
    <g clip-path="url(#browserClip)">
      <rect x="82" y="92" width="1036" height="52" fill="#FAF8F5"/>
      <circle cx="112" cy="118" r="5" fill="#D9A87C"/>
      <circle cx="132" cy="118" r="5" fill="#C9954C"/>
      <circle cx="152" cy="118" r="5" fill="#8C6E5A"/>
      <rect x="177" y="108" width="286" height="20" rx="10" fill="#FFFFFF" stroke="#EFEBE4"/>
      <text x="192" y="122" fill="#A89484" font-family="Bricolage Grotesque, Segoe UI, Arial, sans-serif" font-size="10">https://johnanderson.dev</text>

      <rect x="82" y="144" width="1036" height="664" fill="#FFFFFF"/>
      <circle cx="306" cy="288" r="202" fill="#C9954C" opacity=".04"/>
      <circle cx="996" cy="574" r="246" fill="#6B4C3B" opacity=".04"/>

      <rect x="122" y="176" width="90" height="30" rx="8" fill="#F0EAE1"/>
      <text x="138" y="196" fill="#6B4C3B" font-family="Bricolage Grotesque, Georgia, serif" font-style="italic" font-size="18" font-weight="600">John.</text>

      <g fill="#6B4C3B" font-family="Bricolage Grotesque, Segoe UI, Arial, sans-serif" font-size="9" font-weight="600">
        <text x="493" y="194">Home</text>
        <text x="545" y="194">About</text>
        <text x="597" y="194">Work</text>
        <text x="649" y="194">Skills</text>
        <text x="701" y="194">Blog</text>
        <text x="753" y="194">Contact</text>
      </g>
      <rect x="940" y="174" width="138" height="34" rx="9" fill="#6B4C3B"/>
      <text x="970" y="195" fill="#FAF8F5" font-family="Bricolage Grotesque, Segoe UI, Arial, sans-serif" font-size="9" font-weight="600">Let's talk ↗</text>

      <rect x="122" y="246" width="132" height="24" rx="12" fill="#F2EBE1"/>
      <circle cx="136" cy="258" r="3.5" fill="#C9954C"/>
      <text x="147" y="262" fill="#8C6E5A" font-family="Bricolage Grotesque, Segoe UI, Arial, sans-serif" font-size="7.5" font-weight="700">OPEN TO PROJECTS</text>

      <text x="122" y="326" fill="#1A0F09" font-family="Bricolage Grotesque, Georgia, serif" font-size="50" font-weight="700" letter-spacing="-1.5">Hi, I'm John.</text>
      <text x="122" y="383" fill="#1A0F09" font-family="Bricolage Grotesque, Georgia, serif" font-size="50" font-weight="700" letter-spacing="-1.5">I build products</text>
      <text x="122" y="440" fill="#6B4C3B" font-family="Bricolage Grotesque, Georgia, serif" font-style="italic" font-size="50" font-weight="700" letter-spacing="-1.5">that feel effortless.</text>

      <text x="122" y="482" fill="#7D6556" font-family="Bricolage Grotesque, Segoe UI, Arial, sans-serif" font-size="11">Full-stack developer working across React, Node.js and</text>
      <text x="122" y="500" fill="#7D6556" font-family="Bricolage Grotesque, Segoe UI, Arial, sans-serif" font-size="11">cloud delivery. Performance, accessibility and care.</text>

      <rect x="122" y="534" width="162" height="42" rx="10" fill="#6B4C3B"/>
      <text x="151" y="559" fill="#FAF8F5" font-family="Bricolage Grotesque, Segoe UI, Arial, sans-serif" font-size="10" font-weight="600">Explore selected work →</text>
      <rect x="297" y="534" width="124" height="42" rx="10" fill="#FFFFFF" stroke="#D9CFC2"/>
      <text x="322" y="559" fill="#4E3427" font-family="Bricolage Grotesque, Segoe UI, Arial, sans-serif" font-size="10" font-weight="600">View résumé</text>

      <g transform="translate(0 0)">
        <circle cx="852" cy="340" r="172" fill="none" stroke="#C9954C" stroke-opacity=".25" stroke-dasharray="5 7"/>
        <circle cx="852" cy="340" r="146" fill="url(#accent)" opacity=".12"/>
        <circle cx="852" cy="340" r="138" fill="url(#accent)"/>
        <g clip-path="url(#portraitClip)">
